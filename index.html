<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <style>
.image-map-container {
    position: relative;
    display: inline-block;
    max-width: 100%;
    height: auto;
}

.image-map-container img {
    display: block;
    width: 100%;
    height: auto;
}

.clickable-rect {
    position: absolute;
    /* Optional: Uncomment the background and border lines below while testing 
       so you can see where your rectangles are positioned. */
    /* background-color: rgba(255, 0, 0, 0.3); */
    /* border: 2px dashed red; */
    cursor: pointer;
    transition: background-color 0.2s ease;
}

/* Optional hover effect to show users it's clickable */
.clickable-rect:hover {
    background-color: rgba(255, 255, 255, 0.2);
}        
    </style>
</head>
<body>
    <div class="image-map-container">
        <!-- Your PNG image -->
        <img src="map.jpg" alt="Interactive Map" width="862" height="665">
    
        <!-- Clickable Rectangle 1 -->
        <a href="Alfred-Hoffmann-Brücke.html" class="clickable-rect" style="top: 20%; left: 10%; width: 25%; height: 30%;" title="Go to Page 1"></a>
    
        <!-- Clickable Rectangle 2 -->
        <a href="Friedenstunnel.html" class="clickable-rect" style="top: 55%; left: 60%; width: 30%; height: 35%;" title="Go to Page 2"></a>
    </div>
</body>
</html>
